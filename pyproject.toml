[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crustify"
version = "0.1.0"
description = "Pricing of Crustify's agent sessions from their transcripts"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
crustify-usage = "crustify.usage:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["crustify*"]

[tool.setuptools.package-data]
crustify = ["prompts/*.md", "prompts/skills/*/*.md"]
